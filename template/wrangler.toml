name = "mini-app"
main = "api/cf-interactions.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ── Environment variables ──────────────────────────────
# Set secrets via `wrangler secret put <NAME>` or the dashboard.
# For local dev, create a .dev.vars file (git-ignored) with the same keys.
[vars]
DISCORD_APPLICATION_ID = ""
DISCORD_PUBLIC_KEY = ""

# Secrets (use `wrangler secret put` or .dev.vars for local):
#   DISCORD_BOT_TOKEN
#   DISCORD_CLIENT_SECRET
#   DISCORD_REDIRECT_URI
#   MONGODB_URI

# ── Static assets ──────────────────────────────────────
# Serve index.html and public/ pages at / and /pages/*.
# Requires the @cloudflare/workers-types package for the Assets binding.
# Uncomment the block below if you want asset serving:
# [site]
# bucket = "./public"
